name: cffconvert

on:
  workflow_dispatch:

jobs:
  validate:
    name: "cffconvert"
    runs-on: ubuntu-latest
    steps:
      - name: Install eossr
        run: |
          pip install eossr

      - name: Check out a copy of the repository
        uses: actions/checkout@v7

      - name: Check whether the citation metadata from CITATION.cff is valid
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"

      - name: Convert CITATION.cff to Codemeta metadata format
        uses: citation-file-format/cffconvert-github-action@2.0.0
        if: success()
        with:
          args: "--infile ./CITATION.cff --format codemeta --outfile codemeta.json"

      - name: Fix codemeta.json
        if: success()
        run: |
          cd dev && python codemeta.py

      - name: Validate codemeta.json
        if: success()
        run: |
          eossr-metadata-validator codemeta.json

      - name: Convert CodeMeta to Zenodo
        uses: escape2020/codemeta2zenodo@v1.3.0
        if: success()
        with:
          overwrite: true

      - name: Remove publication_date from .zenodo.json
        if: success()
        run: |
          jq 'del(.publication_date)' .zenodo.json > .zenodo.json.tmp
          mv .zenodo.json.tmp .zenodo.json

      - name: Validate Zenodo Metadata
        uses: vsoch/zenodo-validator@main
        with:
          path: '.zenodo.json'

      - name: Open a pull request with updated metadata
        uses: peter-evans/create-pull-request@v8
        with:
          branch: auto/update-citation-metadata
          delete-branch: true
          commit-message: Update codemeta.json and .zenodo.json from CITATION.cff
          title: Update codemeta.json and .zenodo.json
          body: |
            Generated by the `cffconvert` workflow from `CITATION.cff`.
          add-paths: |
            codemeta.json
            .zenodo.json
